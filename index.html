<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2F3A">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quản lý tài sản">
<title>Quản lý tài sản</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
<script src="assets/common.js"></script>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="main"><div id="view" aria-live="polite"></div></main>
<nav class="tabbar" id="tabbar" aria-label="Điều hướng chính"></nav>
<div class="toast-root" id="toast-root" aria-live="polite"></div>
<div id="sheet-root"></div>
<noscript><p style="padding:24px">Ứng dụng cần bật JavaScript để hoạt động.</p></noscript>
<script>
/* ===== PHẦN 1: lõi ứng dụng, khung giao diện, trang chủ, danh sách và hồ sơ tài sản ===== */
(function () {
  'use strict';
  var Q = window.QL, esc = Q.esc, icon = Q.icon, api = Q.api, Auth = Q.Auth, toast = Q.toast;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var view = document.getElementById('view');
  var S = { cfg: null, meta: null, assets: null, assetsAt: 0, nav: 0, badge: { tasks: 0, inc: 0 } };
  var KIND = { plan: 'Bảo trì', kiemdinh: 'Kiểm định', baohanh: 'Hết bảo hành', hopdong: 'Hợp đồng' };
  var isStaff = function () { return Auth.is(); };
  var canEdit = function () { return Auth.can(['BQT', 'KY_THUAT']); };

  /* ---------- Thành phần dùng lại ---------- */
  function statusTag(s) { return '<span class="tag ' + Q.toneOfStatus(s) + '"><i class="dot"></i>' + esc(s) + '</span>'; }
  function planTag(p) { return '<span class="tag ' + Q.toneOfPlan(p.trangThai) + '">' + esc(p.trangThai === 'Còn hạn' ? 'Còn hạn' : Q.dueText(p.conLai)) + '</span>'; }
  function monogram(code, cls) { return '<span class="' + (cls || 'thumb') + '" style="background:' + Q.hue(code) + ';color:#fff">' + esc(code) + '</span>'; }
  function emptyBox(ic, title, text, action) {
    return '<div class="empty">' + icon(ic) + '<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' + (action || '') + '</div>';
  }
  function skeleton(n) { var h = ''; for (var i = 0; i < (n || 5); i++) h += '<div class="sk-row"><div class="sk"></div><div><div class="sk sk-line" style="width:70%"></div><div class="sk sk-line" style="width:45%"></div></div></div>'; return '<div class="register">' + h + '</div>'; }
  function errorView(msg, retry) {
    view.innerHTML = '<div class="page">' + emptyBox('alert', 'Không tải được dữ liệu', msg, '<button class="btn" id="retry">' + icon('refresh', 'sm') + 'Thử lại</button>') + '</div>';
    $('#retry').onclick = retry;
  }
  function busy(btn, fn) {
    var old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    return Promise.resolve().then(fn).finally(function () { btn.disabled = false; btn.innerHTML = old; });
  }
  function setTitle(t) { document.title = (t ? t + ' - ' : '') + (S.cfg ? S.cfg.tenNgan || S.cfg.ten : 'Quản lý tài sản'); }
  function go(path) { if (location.hash === '#' + path) render(); else location.hash = path; }

  /* ---------- Ngăn kéo / hộp thoại ---------- */
  function openSheet(o) {
    var root = $('#sheet-root'), prev = document.activeElement, ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '"><div class="sheet-head"><h2>' + esc(o.title) + '</h2><button class="x" type="button" aria-label="Đóng">' + icon('x', 'sm') + '</button></div><div class="sheet-body">' + (o.body || '') + '</div>' + (o.foot ? '<div class="sheet-foot">' + o.foot + '</div>' : '') + '</div>';
    root.appendChild(ov); document.body.style.overflow = 'hidden';
    var done = false;
    var h = {
      el: ov, body: $('.sheet-body', ov), foot: $('.sheet-foot', ov),
      close: function () {
        if (done) return; done = true; ov.remove();
        if (!$('#sheet-root .overlay')) document.body.style.overflow = '';
        if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* bỏ qua */ } }
        if (o.onClose) o.onClose();
      }
    };
    ov.addEventListener('mousedown', function (e) { if (e.target === ov) h.close(); });
    ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') h.close(); });
    $('.x', ov).addEventListener('click', h.close);
    setTimeout(function () { var f = $('input:not([type=hidden]),textarea,select', h.body); (f || $('.x', ov)).focus({ preventScroll: true }); }, 40);
    return h;
  }
  function confirmBox(title, text, ok, danger) {
    return new Promise(function (resolve) {
      var s = openSheet({
        title: title, body: '<p class="muted" style="margin:0">' + esc(text) + '</p>',
        foot: '<button class="btn ghost" data-a="no">Hủy</button><button class="btn ' + (danger ? 'danger' : '') + '" data-a="yes">' + esc(ok || 'Đồng ý') + '</button>',
        onClose: function () { resolve(false); }
      });
      s.foot.addEventListener('click', function (e) { var b = e.target.closest('[data-a]'); if (!b) return; if (b.dataset.a === 'yes') resolve(true); s.close(); });
    });
  }

  /* ---------- Khung: thanh trên và thanh điều hướng ---------- */
  function renderShell() {
    var cfg = S.cfg || {}, u = Auth.user;
    $('#topbar').innerHTML =
      '<a class="brand" href="#/"><span class="brand-mark"></span><span><span class="brand-name">' + esc(cfg.tenNgan || cfg.ten || 'Quản lý tài sản') + '</span><div class="brand-sub">Quản lý tài sản</div></span></a><span class="grow"></span>' +
      (u ? '<button class="chip-user" id="btn-account" aria-label="Tài khoản"><span class="avatar">' + esc(initial(u.ten)) + '</span>' + esc(shortName(u.ten)) + '</button>'
        : '<a class="btn-login" href="#/login">Đăng nhập</a>');
    var tabs = u ? [
      ['home', '/', 'home', 'Trang chủ'], ['assets', '/assets', 'box', 'Tài sản'], ['scan', '/scan', 'qr', 'Quét QR'],
      ['tasks', '/tasks', 'tasks', 'Công việc'], ['incidents', '/incidents', 'alert', 'Sự cố']
    ] : [
      ['home', '/', 'home', 'Trang chủ'], ['assets', '/assets', 'box', 'Tài sản'], ['scan', '/scan', 'qr', 'Quét QR'],
      ['report', '/report', 'alert', 'Báo sự cố'], ['login', '/login', 'lock', 'Đăng nhập']
    ];
    if (u && u.vaiTro === 'BQT') tabs.push(['dashboard', '/dashboard', 'chart', 'Tổng quan']);
    $('#tabbar').innerHTML = tabs.map(function (t) {
      var n = t[0] === 'tasks' ? S.badge.tasks : (t[0] === 'incidents' ? S.badge.inc : 0);
      return '<a class="tab ' + (t[0] === 'scan' ? 'scan' : '') + (t[0] === 'dashboard' ? ' desk-only' : '') + '" data-tab="' + t[0] + '" href="#' + t[1] + '">' +
        (t[0] === 'scan' ? '<span class="ico-wrap">' + icon(t[2]) + '</span>' : icon(t[2])) + '<span>' + t[3] + '</span>' + (n ? '<span class="count">' + (n > 99 ? '99+' : n) + '</span>' : '') + '</a>';
    }).join('');
    var b = $('#btn-account'); if (b) b.onclick = openAccount;
  }
  function initial(n) { n = String(n || '?').trim(); return n.split(/\s+/).pop().charAt(0).toUpperCase(); }
  function shortName(n) { var p = String(n || '').trim().split(/\s+/); return p.length > 2 ? p.slice(-2).join(' ') : p.join(' '); }
  function markTab(name) {
    $$('#tabbar .tab').forEach(function (t) { if (t.dataset.tab === name) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  }
  function setBadges(h) { if (!h || !h.stats) return; S.badge.tasks = (h.stats.quaHan || 0); S.badge.inc = (h.stats.suCoMo || 0); renderShell(); markTab(S.curTab); }

  /* ---------- Dữ liệu dùng chung ---------- */
  function loadAssets(force) {
    if (!force && S.assets && Date.now() - S.assetsAt < 90000) return Promise.resolve(S.assets);
    return api('assets').then(function (a) { S.assets = a; S.assetsAt = Date.now(); return a; });
  }
  function loadMeta() { if (S.meta || !canEditOrStaff()) return Promise.resolve(S.meta || { locations: [], vendors: [] }); return api('meta').then(function (m) { S.meta = m; return m; }); }
  function canEditOrStaff() { return isStaff(); }
  function invalidate() { S.assetsAt = 0; S.assets = null; S.meta = null; }

  /* ---------- Hàng danh sách ---------- */
  function assetRow(a) {
    var img = a.anh ? '<img class="thumb" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="' + esc(Q.thumb(a.anh, 160)) + '">' : monogram(a.nhom, 'thumb');
    var due = (isStaff() && a.kh && a.kh.trangThai !== 'Còn hạn') ? '<span class="tag ' + Q.toneOfPlan(a.kh.trangThai) + '">' + esc(Q.dueText(a.kh.conLai)) + '</span>' : '';
    return '<a class="row" href="#/a/' + encodeURIComponent(a.id) + '">' + img + '<div><p class="name">' + esc(a.ten) + '</p><div class="sub"><span class="mono">' + esc(a.id) + '</span>' +
      (a.viTri ? '<span>' + icon('pin') + esc(a.viTri) + '</span>' : '') + '</div></div><div class="end">' + statusTag(a.tinhTrang) + due + '</div></a>';
  }
  function taskRow(t) {
    var tone = t.trangThai === 'Quá hạn' ? 'bad' : 'warn', tag = '<span class="tag ' + tone + '">' + esc(Q.dueText(t.soNgay)) + '</span>';
    var inner = '<span class="bar ' + tone + '"></span><div><p class="name">' + esc(t.ten) + '</p><div class="sub"><span>' + esc(t.hangMuc || KIND[t.loai]) + '</span>' + (t.viTri ? '<span>' + icon('pin') + esc(t.viTri) + '</span>' : '') +
      '</div></div><div class="end">' + tag + '<span class="faint" style="font-size:12px">hạn ' + esc(Q.fmtDate(t.han)) + '</span></div>';
    return t.maTS ? '<a class="row no-thumb" href="#/a/' + encodeURIComponent(t.maTS) + '">' + inner + '</a>' : '<div class="row no-thumb">' + inner + '</div>';
  }
  function logRow(l) {
    return '<a class="row no-thumb" href="#/a/' + encodeURIComponent(l.maTS) + '"><div><p class="name">' + esc(l.tenTS) + '</p><div class="sub"><span>' + esc(l.loai) + '</span><span>' + esc(Q.ago(l.thoiGian)) + '</span></div>' +
      '<div class="muted" style="font-size:13.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(l.noiDung) + '</div></div><span></span></a>';
  }

  /* ---------- Trang chủ ---------- */
  function viewHome() {
    var my = ++S.nav, cfg = S.cfg, u = Auth.user, staff = isStaff();
    setTitle('');
    var hero = '<section class="hero"><div class="page"><p class="kicker">' + esc(staff ? cfg.ten : 'Quản lý tài sản tòa nhà') + '</p><h1>' + esc(staff ? u.ten : cfg.ten) + '</h1><p>' +
      (staff ? (u.ten === u.vaiTroTen ? '' : esc(u.vaiTroTen) + '. ') + 'Dưới đây là việc cần chú ý hôm nay.' : 'Tra cứu thiết bị, xem lịch sử bảo trì và gửi phản ánh khi phát hiện sự cố.') + '</p>' +
      (staff ? '' : '<div class="hero-actions"><a class="btn signal" href="#/scan">' + icon('qr', 'sm') + 'Quét mã QR</a><a class="btn on-dark" href="#/report">' + icon('alert', 'sm') + 'Báo sự cố</a></div>') + '</div></section>' +
      '<form class="searchbox" id="home-search" role="search">' + icon('search') + '<input type="search" placeholder="Tìm thiết bị theo tên hoặc mã" aria-label="Tìm thiết bị" autocomplete="off"></form>';
    view.innerHTML = hero + '<div class="page" id="home-body" style="padding-top:26px">' + skeleton(4) + '</div>';
    $('#home-search').addEventListener('submit', function (e) { e.preventDefault(); var q = $('input', e.target).value.trim(); go('/assets' + (q ? '?q=' + encodeURIComponent(q) : '')); });
    return api('home').then(function (h) {
      if (my !== S.nav) return;
      if (Auth.is() && !h.user) { Auth.clear(); renderShell(); markTab('home'); toast('Phiên đăng nhập đã hết hạn.', 'err'); return viewHome(); }
      setBadges(h);
      var b = '';
      if (cfg.thongBao) b += '<div class="notice">' + icon('info') + '<span>' + esc(cfg.thongBao) + '</span></div>';
      if (staff) {
        var st = h.stats;
        b += '<div class="strip" style="margin-top:2px"><a class="cell" href="#/tasks"><div class="num ' + (st.quaHan ? 'bad' : '') + '">' + st.quaHan + '</div><div class="lbl">Quá hạn</div></a>' +
          '<a class="cell" href="#/tasks"><div class="num ' + (st.sapDen ? 'warn' : '') + '">' + st.sapDen + '</div><div class="lbl">Sắp đến hạn</div></a>' +
          '<a class="cell" href="#/incidents"><div class="num ' + (st.suCoMo ? 'info' : '') + '">' + st.suCoMo + '</div><div class="lbl">Sự cố đang mở</div></a>' +
          '<a class="cell" href="#/assets"><div class="num">' + st.taiSan + '</div><div class="lbl">Tài sản</div></a></div>';
        if (st.choDuyet) b += '<a class="notice" href="#/dashboard" style="text-decoration:none;margin-top:12px">' + icon('money') + '<span>' + st.choDuyet + ' khoản chi phí đang chờ Ban Quản Trị duyệt.</span></a>';
        b += '<div class="section"><div class="quick">' +
          '<a href="#/scan"><span class="qi y">' + icon('qr') + '</span>Quét mã QR</a>' +
          (canEdit() ? '<a href="#/new"><span class="qi">' + icon('plus') + '</span>Thêm tài sản</a>' : '') +
          '<a href="#/report"><span class="qi">' + icon('alert') + '</span>Báo sự cố</a>' +
          (Auth.can(['BQT']) ? '<a href="#/dashboard"><span class="qi">' + icon('chart') + '</span>Tổng quan</a>' : '') +
          (Auth.can(['BQT', 'KY_THUAT']) ? '<button id="btn-share"><span class="qi">' + icon('share') + '</span>Gửi tổng hợp</button>' : '') +
          (Auth.can(['BQT', 'KY_THUAT']) ? '<a href="labels.html"><span class="qi">' + icon('printer') + '</span>In tem QR</a>' : '') + '</div></div>';
        b += '<div class="section"><div class="section-head"><h2>Cần làm</h2><a class="more" href="#/tasks">Xem tất cả</a></div>' +
          (h.tasks.length ? '<div class="register">' + h.tasks.map(taskRow).join('') + '</div>' : '<div class="panel">' + emptyBox('check', 'Không có việc quá hạn', 'Mọi lịch bảo trì đang trong hạn.') + '</div>') + '</div>';
      } else {
        if (cfg.hotline) b += '<a class="panel pad" href="tel:' + esc(cfg.hotline.replace(/[^\d+]/g, '')) + '" style="display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;margin-top:18px"><span class="qi" style="width:40px;height:40px;border-radius:9px;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center">' + icon('phone') + '</span><span><b>Khẩn cấp cần xử lý ngay?</b><br><span class="muted">Gọi trực ban ' + esc(cfg.hotline) + '</span></span></a>';
        b += '<div class="section" style="margin-top:22px"><div class="section-head"><h2>Thiết bị theo nhóm</h2><a class="more" href="#/assets">Tất cả ' + h.stats.taiSan + '</a></div><div class="groups">' +
          h.groups.map(function (g) { return '<a class="group" href="#/assets?g=' + encodeURIComponent(g.ma) + '">' + monogram(g.ma, 'mono-badge') + '<span style="min-width:0"><span class="g-name">' + esc(g.ten) + '</span><br><span class="g-n">' + g.soLuong + ' thiết bị</span></span></a>'; }).join('') + '</div></div>';
      }
      if (h.recent.length) b += '<div class="section"><div class="section-head"><h2>Bảo trì gần đây</h2></div><div class="register">' + h.recent.map(logRow).join('') + '</div></div>';
      b += '<p class="foot-note">Phiên bản ' + esc(cfg.version) + '</p>';
      $('#home-body').innerHTML = b;
      var sh = $('#btn-share'); if (sh) sh.onclick = function () { shareDigest(sh); };
    }).catch(function (e) { if (my === S.nav) errorView(e.message, viewHome); });
  }

  /* ---------- Danh sách tài sản ---------- */
  function viewAssets(r) {
    var my = ++S.nav, staff = isStaff();
    setTitle('Tài sản');
    var st = { q: r.q.q || '', g: r.q.g || '', f: r.q.f || '', n: 60 };
    view.innerHTML = '<div class="page"><div class="form-title" style="margin-bottom:4px">Tài sản' + (canEdit() ? '<span style="flex:1"></span><a class="btn sm" href="#/new">' + icon('plus', 'sm') + 'Thêm mới</a>' : '') + '</div>' +
      '<div class="searchbox" style="margin:10px 0 0"><span class="sr">Tìm</span>' + icon('search') + '<input id="aq" type="search" placeholder="Tìm theo tên, mã, vị trí" value="' + esc(st.q) + '" autocomplete="off"></div>' +
      '<div class="filters" id="gf"></div><div id="alist" style="margin-top:10px">' + skeleton(6) + '</div></div>';
    return loadAssets().then(function (all) {
      if (my !== S.nav) return;
      var groups = {}; all.forEach(function (a) { groups[a.nhom] = a.nhomTen; });
      function draw() {
        var q = Q.norm(st.q), list = all.filter(function (a) {
          if (st.g && a.nhom !== st.g) return false;
          if (st.f === 'chuy' && !(a.tinhTrang !== 'Hoạt động tốt' && a.tinhTrang !== 'Ngừng sử dụng' || (a.kh && a.kh.trangThai !== 'Còn hạn'))) return false;
          if (st.f === 'noanh' && a.anh) return false;
          return !q || Q.norm(a.ten + ' ' + a.id + ' ' + a.viTri + ' ' + a.nhomTen + ' ' + a.tinhTrang).indexOf(q) >= 0;
        });
        var chips = '<button class="fchip" data-g="" aria-pressed="' + (!st.g) + '">Tất cả (' + all.length + ')</button>' + Object.keys(groups).map(function (g) { return '<button class="fchip" data-g="' + esc(g) + '" aria-pressed="' + (st.g === g) + '">' + esc(groups[g]) + '</button>'; }).join('');
        if (staff) chips += '<span style="width:8px;flex:none"></span><button class="fchip" data-f="chuy" aria-pressed="' + (st.f === 'chuy') + '">Cần chú ý</button><button class="fchip" data-f="noanh" aria-pressed="' + (st.f === 'noanh') + '">Chưa có ảnh</button>';
        $('#gf').innerHTML = chips;
        $('#alist').innerHTML = list.length ? '<p class="muted" style="margin:0 0 8px;font-size:13.5px">' + list.length + ' tài sản</p><div class="register">' + list.slice(0, st.n).map(assetRow).join('') + '</div>' +
          (list.length > st.n ? '<button class="btn ghost block" id="more" style="margin-top:12px">Hiện thêm ' + Math.min(60, list.length - st.n) + ' tài sản</button>' : '')
          : '<div class="panel">' + emptyBox('search', 'Không tìm thấy tài sản', 'Thử từ khóa khác hoặc bỏ bớt bộ lọc.', '<button class="btn ghost" id="clear">Xóa bộ lọc</button>') + '</div>';
        var m = $('#more'); if (m) m.onclick = function () { st.n += 60; draw(); };
        var c = $('#clear'); if (c) c.onclick = function () { st.q = st.g = st.f = ''; $('#aq').value = ''; draw(); };
      }
      $('#gf').addEventListener('click', function (e) {
        var b = e.target.closest('.fchip'); if (!b) return;
        if (b.dataset.f !== undefined) st.f = st.f === b.dataset.f ? '' : b.dataset.f; else st.g = b.dataset.g;
        st.n = 60; draw();
      });
      $('#aq').addEventListener('input', Q.debounce(function (e) { st.q = e.target.value; st.n = 60; draw(); }, 150));
      draw();
    }).catch(function (e) { if (my === S.nav) errorView(e.message, function () { viewAssets(r); }); });
  }

  /* ---------- Hồ sơ tài sản ---------- */
  function logType(l) { return { 'Sửa chữa': 't-sc', 'Kiểm tra': 't-kt', 'Kiểm định': 't-kd', 'Thay thế vật tư': 't-tt' }[l] || ''; }
  function viewAsset(r, id) {
    var my = ++S.nav, staff = isStaff();
    view.innerHTML = '<div class="cover"><div class="sk" style="position:absolute;inset:0;border-radius:0"></div></div><div class="page" style="padding-top:60px">' + skeleton(3) + '</div>';
    return api('asset', { id: id }).then(function (d) {
      if (my !== S.nav) return;
      var a = d.asset; setTitle(a.ten);
      var cover = '<div class="cover">' + (a.anh ? '<img alt="Ảnh ' + esc(a.ten) + '" referrerpolicy="no-referrer" src="' + esc(a.anh) + '">' : '<div class="none">' + monogram(a.nhom, 'mono-badge mb') + '<span>' + (canEdit() ? 'Chưa có ảnh thiết bị' : 'Thiết bị chưa có ảnh') + '</span>' + (canEdit() ? '<a class="btn sm signal" href="#/edit/' + encodeURIComponent(a.id) + '">' + icon('camera', 'sm') + 'Chụp ảnh ngay</a>' : '') + '</div>') +
        '<div class="shade"></div><button class="icon-btn back" id="btn-back" aria-label="Quay lại">' + icon('back') + '</button><span class="cstatus">' + statusTag(a.tinhTrang) + '</span></div>';
      var plate = '<div class="plate"><span class="pid">' + esc(a.id) + '</span><span class="pgrp">' + esc(a.nhomTen) + '</span></div>';

  /* ---------- Quét QR ---------- */
  var scanner = null;
  function stopScanner() { if (scanner) { var s = scanner; scanner = null; try { s.stop().then(function () { s.clear(); }).catch(function () { }); } catch (e) { /* bỏ qua */ } } }
  function codeFromText(t) {
    t = String(t || '').trim();
    try { var u = new URL(t), a = u.searchParams.get('a'); if (a) return a; var m = /#\/a\/([^?]+)/.exec(u.hash); if (m) return decodeURIComponent(m[1]); } catch (e) { /* không phải URL */ }
    return t;
  }
  function viewScan() {
    ++S.nav; setTitle('Quét mã QR');
    view.innerHTML = '<div class="page"><div class="form-title">Quét mã QR</div><p class="muted" style="margin:-6px 0 14px">Đưa camera vào mã QR dán trên thiết bị để mở hồ sơ.</p>' +
      '<div class="scanner"><div id="reader"></div><div class="frame"><i></i><i></i><i></i><i></i></div></div>' +
      '<form id="manual" class="panel pad" style="margin-top:16px"><div class="field"><label for="mcode">Hoặc nhập mã thiết bị</label><div style="display:flex;gap:8px"><input class="input mono" id="mcode" placeholder="' + esc((S.cfg && S.cfg.ma) || 'DP-TM-001') + '" autocapitalize="characters" autocomplete="off"><button class="btn" type="submit" style="white-space:nowrap;flex:none">Mở</button></div></div></form></div>';
    $('#manual').addEventListener('submit', function (e) { e.preventDefault(); var c = codeFromText($('#mcode').value); if (c) go('/a/' + encodeURIComponent(c)); });
    function fail(msg) { var el = document.createElement('div'); el.className = 'msg'; el.textContent = msg; $('.scanner').appendChild(el); }
    return loadScript('lib/html5-qrcode.min.js').then(function () {
      if (!$('#reader')) return;
      scanner = new window.Html5Qrcode('reader', { verbose: false });
      return scanner.start({ facingMode: 'environment' }, { fps: 10, aspectRatio: 1, qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.72); return { width: s, height: s }; } },
        function (text) {
          var c = codeFromText(text); if (!c) return;

          stopScanner(); go('/a/' + encodeURIComponent(c));
        }, function () { });
    }).catch(function () { fail('Không mở được camera. Hãy cho phép trang này dùng camera trong cài đặt trình duyệt, hoặc nhập mã thiết bị ở bên dưới.'); });

        '<div class="field" id="l-ng-f" hidden><span class="lab">Nguồn kinh phí</span>' + opts('l-ng', S.cfg.enums.nguon, '') + '<span class="hint">Khoản chi sẽ chờ Ban Quản Trị duyệt.</span></div>' +
        '<div class="field"><span class="lab">Tình trạng sau khi làm</span>' + opts('l-tt', ['Giữ nguyên'].concat(S.cfg.enums.tinhTrang), 'Giữ nguyên') + '</div>') +
      '<div class="field"><label for="l-d">Ngày thực hiện</label><input class="input" type="date" id="l-d" value="' + todayStr() + '" max="' + todayStr() + '"></div>' +
      switchBtn('l-ck', st.ck, 'Hiển thị cho cư dân', 'Cư dân xem được nội dung này (không có chi phí)') + '<div class="err-msg" id="lerr" role="alert"></div></div>';
    var sh = openSheet({ title: isBV ? 'Ghi kiểm tra' : 'Ghi bảo trì', body: body, foot: '<button class="btn ghost" data-a="x">Hủy</button><button class="btn" data-a="save">Lưu</button>' });
    function syncPlan() { $('#l-plan-f', sh.body).hidden = !(plans.length > 1 && (st.loai === 'Bảo trì định kỳ' || st.loai === 'Kiểm định')); }
    syncPlan();
    bindOpts(sh.body, '#l-loai', function (v) { st.loai = v; syncPlan(); });
    bindOpts(sh.body, '#l-ng', function (v) { st.nguon = v; }, true);
    bindOpts(sh.body, '#l-tt', function (v) { st.tt = v === 'Giữ nguyên' ? '' : v; });
    bindSwitch(sh.body, '#l-ck', function (v) { st.ck = v; });
    var cp = $('#l-cp', sh.body); if (cp) { moneyInput(cp); cp.addEventListener('input', function () { $('#l-ng-f', sh.body).hidden = !(cp.value.replace(/\D/g, '') > 0); }); }
    sh.foot.addEventListener('click', function (e) {
      var b = e.target.closest('[data-a]'); if (!b) return; if (b.dataset.a === 'x') return sh.close();
      var err = $('#lerr', sh.body); err.textContent = '';
      var nd = $('#l-nd', sh.body).value.trim(), cost = cp ? +cp.value.replace(/\D/g, '') : 0;
      if (nd.length < 3) { err.textContent = 'Vui lòng nhập nội dung đã làm.'; $('#l-nd', sh.body).focus(); return; }
      if (cost > 0 && !st.nguon) { err.textContent = 'Vui lòng chọn nguồn kinh phí cho khoản chi.'; return; }
      busy(b, function () {
        return api('addLog', { maTS: a.id, loai: st.loai, noiDung: nd, chiPhi: cost || undefined, nguon: st.nguon || undefined, tinhTrangMoi: st.tt || undefined, ngay: $('#l-d', sh.body).value || undefined, congKhai: st.ck ? 'Y' : 'N', maKH: st.maKH && !$('#l-plan-f', sh.body).hidden ? $('#l-plan', sh.body).value : (plans.length === 1 ? plans[0].ma : undefined) })
          .then(function () { invalidate(); toast('Đã lưu nhật ký.'); sh.close(); render(); });
      }).catch(function (er) { err.textContent = er.message; });
    });
  }

  /* ---------- Lịch bảo trì ---------- */
  function openPlanSheet(a, plan) {
    var st = { chuKy: plan ? plan.chuKy : 90 };
    var body = '<div class="form"><div class="field"><label for="p-hm">Hạng mục</label><input class="input" id="p-hm" maxlength="100" value="' + esc(plan ? plan.hangMuc : '') + '" placeholder="Ví dụ: Vệ sinh bể nước"></div>' +
      '<div class="field"><label for="p-ck">Chu kỳ (ngày)</label><input class="input" id="p-ck" inputmode="numeric" value="' + st.chuKy + '"><div class="opts" id="p-pre" style="margin-top:4px">' + [[7, 'Tuần'], [30, 'Tháng'], [90, 'Quý'], [180, '6 tháng'], [365, 'Năm']].map(function (x) { return '<button type="button" class="opt" data-d="' + x[0] + '" aria-pressed="' + (x[0] === st.chuKy) + '">' + x[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="field"><label for="p-ln">Lần bảo trì gần nhất</label><input class="input" type="date" id="p-ln" max="' + todayStr() + '" value="' + esc(plan && plan.lanCuoi ? plan.lanCuoi : todayStr()) + '"></div>' +
      '<div class="field"><label for="p-pt">Người phụ trách (không bắt buộc)</label><input class="input" id="p-pt" maxlength="60" value="' + esc(plan ? plan.phuTrach : '') + '"></div><div class="err-msg" id="perr" role="alert"></div></div>';
    var foot = (plan && Auth.can(['BQT']) ? '<button class="btn ghost" data-a="del" style="color:var(--bad)">Xóa</button>' : '<button class="btn ghost" data-a="x">Hủy</button>') + '<button class="btn" data-a="save">Lưu lịch</button>';
    var sh = openSheet({ title: plan ? 'Sửa lịch bảo trì' : 'Thêm lịch bảo trì', body: body, foot: foot });
    $('#p-pre', sh.body).onclick = function (e) { var b = e.target.closest('[data-d]'); if (!b) return; $('#p-ck', sh.body).value = b.dataset.d; $$('[data-d]', sh.body).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); };
    function send(b, extra) {
      var err = $('#perr', sh.body); err.textContent = '';
      var hm = $('#p-hm', sh.body).value.trim(), ck = +$('#p-ck', sh.body).value;
      if (!hm) { err.textContent = 'Vui lòng nhập hạng mục.'; return; } if (!(ck >= 1 && ck <= 3650)) { err.textContent = 'Chu kỳ phải từ 1 đến 3650 ngày.'; return; }
      busy(b, function () { return api('savePlan', Object.assign({ maTS: a.id, ma: plan ? plan.ma : undefined, hangMuc: hm, chuKy: ck, lanGanNhat: $('#p-ln', sh.body).value, phuTrach: $('#p-pt', sh.body).value }, extra)).then(function () { invalidate(); toast(extra && extra.xoa ? 'Đã xóa lịch.' : 'Đã lưu lịch bảo trì.'); sh.close(); render(); }); }).catch(function (er) { err.textContent = er.message; });
    }
    sh.foot.addEventListener('click', function (e) {
      var b = e.target.closest('[data-a]'); if (!b) return;
      if (b.dataset.a === 'x') return sh.close();
      if (b.dataset.a === 'del') return confirmBox('Xóa lịch bảo trì?', 'Lịch "' + plan.hangMuc + '" sẽ bị xóa. Lịch sử đã ghi vẫn được giữ.', 'Xóa lịch', true).then(function (ok) { if (ok) send(b, { xoa: true }); });
      send(b);
    });
  }

  /* ---------- Tổng quan (Ban Quản Trị) ---------- */
  function niceMax(m) { if (m <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(m))), f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
  function costChart(rows) {
    var W = 640, H = 220, pl = 44, pb = 26, pt = 12, max = niceMax(Math.max.apply(null, rows.map(function (r) { return r.daDuyet + r.choDuyet; })) || 0), ih = H - pb - pt, bw = (W - pl) / rows.length;
    var g = '';[0, .5, 1].forEach(function (t) { var y = pt + ih * (1 - t); g += '<line x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-dasharray="' + (t ? '3 4' : '0') + '"/><text x="' + (pl - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + (t ? Q.moneyShort(max * t) : '0') + '</text>'; });
    rows.forEach(function (r, i) {
      var x = pl + i * bw + bw * .2, w = bw * .6, h1 = ih * r.daDuyet / max, h2 = ih * r.choDuyet / max, y1 = pt + ih - h1;
      if (h1) g += '<rect x="' + x + '" y="' + y1 + '" width="' + w + '" height="' + h1 + '" fill="var(--enamel)" rx="2"><title>' + r.thang + ': ' + Q.money(r.daDuyet) + ' đã duyệt</title></rect>';
      if (h2) g += '<rect x="' + x + '" y="' + (y1 - h2) + '" width="' + w + '" height="' + h2 + '" fill="var(--signal)" rx="2"><title>' + r.thang + ': ' + Q.money(r.choDuyet) + ' chờ duyệt</title></rect>';
      g += '<text x="' + (x + w / 2) + '" y="' + (H - 8) + '" text-anchor="middle">T' + parseInt(r.thang.slice(5), 10) + '</text>';
    });
    var total = rows.reduce(function (s, r) { return s + r.daDuyet + r.choDuyet; }, 0);
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Chi phí bảo trì 12 tháng gần nhất, tổng ' + Q.money(total) + '">' + g + '</svg>';
  }
  function donut(map, order) {
    var tones = { 'Hoạt động tốt': 'var(--ok)', 'Cần theo dõi': 'var(--signal)', 'Đang sửa chữa': 'var(--info)', 'Hỏng': 'var(--bad)', 'Ngừng sử dụng': 'var(--ink-3)' };
    var total = order.reduce(function (s, k) { return s + (map[k] || 0); }, 0) || 1, c = 2 * Math.PI * 42, off = 0, arcs = '';
    order.forEach(function (k) { var v = map[k] || 0; if (!v) return; var len = c * v / total; arcs += '<circle cx="60" cy="60" r="42" fill="none" stroke="' + tones[k] + '" stroke-width="18" stroke-dasharray="' + len + ' ' + (c - len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 60 60)"/>'; off += len; });
    return '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg viewBox="0 0 120 120" style="width:132px;flex:none" role="img" aria-label="Tình trạng tài sản">' + arcs + '<text x="60" y="58" text-anchor="middle" style="font:700 26px var(--font-display);fill:var(--ink)">' + total + '</text><text x="60" y="74" text-anchor="middle">tài sản</text></svg><div class="legend" style="flex-direction:column;gap:6px;margin:0">' +
      order.map(function (k) { return '<span><i style="background:' + tones[k] + '"></i>' + esc(k) + ': <b>' + (map[k] || 0) + '</b></span>'; }).join('') + '</div></div>';
  }
  function viewDashboard() {
    var my = ++S.nav; setTitle('Tổng quan');
    view.innerHTML = '<div class="page wide"><div class="form-title">Tổng quan</div>' + skeleton(4) + '</div>';
    return api('dashboard').then(function (d) {
      if (my !== S.nav) return;
      var t = d.tong, yearTotal = d.nhom.reduce(function (s, g) { return s + g.chiPhi; }, 0), maxG = Math.max.apply(null, d.nhom.map(function (g) { return g.chiPhi; }).concat([1]));
      var h = '<div class="page wide"><div class="form-title">Tổng quan</div>' +
        '<div class="strip"><a class="cell" href="#/assets"><div class="num">' + t.taiSan + '</div><div class="lbl">Tài sản</div></a><a class="cell" href="#/tasks"><div class="num ' + (t.quaHan ? 'bad' : '') + '">' + t.quaHan + '</div><div class="lbl">Quá hạn</div></a><a class="cell" href="#/tasks"><div class="num ' + (t.sapDen ? 'warn' : '') + '">' + t.sapDen + '</div><div class="lbl">Sắp đến hạn</div></a><a class="cell" href="#/incidents"><div class="num ' + (t.suCoMo ? 'info' : '') + '">' + t.suCoMo + '</div><div class="lbl">Sự cố đang mở</div></a></div>' +
        '<div class="charts section"><div class="panel pad chart"><p class="chart-title">Chi phí bảo trì 12 tháng</p><p class="chart-sub">Tổng ' + esc(Q.money(d.chiPhiThang.reduce(function (s, r) { return s + r.daDuyet + r.choDuyet; }, 0))) + '</p>' + costChart(d.chiPhiThang) + '<div class="legend"><span><i style="background:var(--enamel)"></i>Đã duyệt</span><span><i style="background:var(--signal)"></i>Chờ duyệt</span></div></div>' +
        '<div class="panel pad chart"><p class="chart-title">Tình trạng thiết bị</p><p class="chart-sub">Tất cả tài sản đang quản lý</p>' + donut(d.tinhTrang, S.cfg.enums.tinhTrang) + '</div></div>';
      if (d.choDuyet.length) h += '<div class="section"><div class="section-head"><h2>Chi phí chờ duyệt (' + d.choDuyet.length + ')</h2></div><div class="register">' + d.choDuyet.map(function (l) {
        return '<div class="row no-thumb"><div><p class="name"><a href="#/a/' + encodeURIComponent(l.maTS) + '" style="color:inherit;text-decoration:none">' + esc(l.tenTS) + '</a></p><div class="sub"><span>' + esc(l.loai) + '</span><span>' + esc(l.nguoi) + '</span><span>' + esc(Q.fmtDate(l.thoiGian)) + '</span></div><div class="muted" style="font-size:13.5px;margin-top:3px">' + esc(l.noiDung) + '</div></div><div class="end"><b>' + esc(Q.money(l.chiPhi)) + '</b><div style="display:flex;gap:6px"><button class="btn sm" data-approve="Đã duyệt" data-id="' + esc(l.id) + '">Duyệt</button><button class="btn sm ghost" data-approve="Từ chối" data-id="' + esc(l.id) + '">Từ chối</button></div></div></div>'; }).join('') + '</div></div>';
      h += '<div class="charts section" style="grid-template-columns:' + '' + '"><div class="panel pad"><p class="chart-title">Chi phí theo nhóm năm ' + esc(d.chiPhiNam) + '</p><p class="chart-sub">Tổng ' + esc(Q.money(yearTotal)) + '</p>' +
        (yearTotal ? d.nhom.filter(function (g) { return g.chiPhi > 0; }).sort(function (a, b) { return b.chiPhi - a.chiPhi; }).map(function (g) { return '<div class="hbar"><span class="l">' + esc(g.ten) + '</span><span class="track"><span class="fill" style="display:block;width:' + Math.max(3, g.chiPhi / maxG * 100) + '%"></span></span><b>' + esc(Q.moneyShort(g.chiPhi)) + '</b></div>'; }).join('') : '<p class="muted" style="margin:0">Chưa có khoản chi nào trong năm.</p>') + '</div>' +
        '<div class="panel pad"><p class="chart-title">Tài sản tốn chi phí nhất</p><p class="chart-sub">Năm ' + esc(d.chiPhiNam) + '</p>' + (d.topChiPhi.length ? d.topChiPhi.map(function (x) { return '<a class="hbar" style="grid-template-columns:1fr auto;text-decoration:none;color:inherit" href="#/a/' + encodeURIComponent(x.id) + '"><span class="l">' + esc(x.ten) + '</span><b>' + esc(Q.moneyShort(x.chiPhi)) + '</b></a>'; }).join('') : '<p class="muted" style="margin:0">Chưa có dữ liệu.</p>') + '</div></div>';
      h += '<div class="section"><div class="section-head"><h2>Cần chú ý</h2><a class="more" href="#/tasks">Xem công việc</a></div>' + (d.canhBao.length ? '<div class="register">' + d.canhBao.slice(0, 10).map(taskRow).join('') + '</div>' : '<div class="panel">' + emptyBox('check', 'Không có cảnh báo', 'Không có lịch, kiểm định hay hợp đồng nào sắp hết hạn.') + '</div>') + '</div></div>';
      view.innerHTML = h;
      $$('[data-approve]', view).forEach(function (el) { el.onclick = function () { busy(el, function () { return api('approveLog', { id: el.dataset.id, duyet: el.dataset.approve }).then(function () { toast(el.dataset.approve === 'Đã duyệt' ? 'Đã duyệt chi phí.' : 'Đã từ chối khoản chi.'); viewDashboard(); }); }).catch(function (e) { toast(e.message, 'err'); }); }; });
    }).catch(function (e) { if (my === S.nav) errorView(e.message, viewDashboard); });
  }

  /* ---------- Tổng hợp gửi Zalo ---------- */
  function shareDigest(btn) {
    busy(btn, function () { return api('digest'); }).then(function (d) {
      var sh = openSheet({ title: 'Tổng hợp hôm nay', body: '<p class="muted" style="margin:0 0 10px">' + (d.count ? 'Sao chép nội dung dưới đây rồi dán vào nhóm Zalo của tòa nhà.' : 'Hiện không có việc cần chú ý.') + '</p><textarea class="textarea mono" id="dg" readonly style="min-height:240px;font-size:13px">' + esc(d.text) + '</textarea>', foot: '<button class="btn ghost" data-a="x">Đóng</button><button class="btn" data-a="copy">' + icon('share', 'sm') + (navigator.share ? 'Chia sẻ' : 'Sao chép') + '</button>' });
      sh.foot.addEventListener('click', function (e) {
        var b = e.target.closest('[data-a]'); if (!b) return; if (b.dataset.a === 'x') return sh.close();
        if (navigator.share) navigator.share({ text: d.text }).catch(function () { });
        else { var ta = $('#dg', sh.body); ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(d.text) : Promise.reject()).then(function () { toast('Đã sao chép, hãy dán vào nhóm Zalo.'); }, function () { try { document.execCommand('copy'); toast('Đã sao chép, hãy dán vào nhóm Zalo.'); } catch (x) { toast('Hãy bấm giữ để sao chép nội dung.', 'err'); } }); }
      });
    }).catch(function (e) { toast(e.message, 'err'); });
  }

  /* ---------- Tài khoản ---------- */
  function openAccount() {
    var u = Auth.user, th = Q.Theme.get();
    var sh = openSheet({ title: 'Tài khoản', body: '<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px"><span class="avatar" style="width:52px;height:52px;font-size:24px">' + esc(initial(u.ten)) + '</span><span><b style="font-size:17px">' + esc(u.ten) + '</b><br><span class="muted">' + esc(u.vaiTroTen) + '</span></span></div>' +
      '<div class="field"><span class="lab">Giao diện</span>' + opts('th', ['auto', 'light', 'dark'], th, function (x) { return { auto: 'Tự động', light: 'Sáng', dark: 'Tối' }[x]; }) + '</div><p class="foot-note" style="margin:18px 0 0;text-align:left">Phiên bản ' + esc(S.cfg.version) + '</p>', foot: '<button class="btn ghost" data-a="out" style="color:var(--bad)">' + icon('logout', 'sm') + 'Đăng xuất</button>' });
    bindOpts(sh.body, '#th', function (v) { Q.Theme.set(v); });
    sh.foot.addEventListener('click', function (e) { if (!e.target.closest('[data-a="out"]')) return; Auth.clear(); invalidate(); S.badge = { tasks: 0, inc: 0 }; sh.close(); renderShell(); toast('Đã đăng xuất.'); go('/'); });
  }

  /* ---------- Định tuyến ---------- */
  function parseHash() {
    var h = location.hash.replace(/^#/, '') || '/', i = h.indexOf('?'), path = i >= 0 ? h.slice(0, i) : h, qs = i >= 0 ? h.slice(i + 1) : '', q = {};
    new URLSearchParams(qs).forEach(function (v, k) { q[k] = v; });
    return { parts: path.split('/').filter(Boolean).map(decodeURIComponent), q: q };
  }
  S.routes = 0;
  var lastPath = '';
  function render() {
    stopScanner(); S.routes++;
    var r = parseHash(), p = r.parts, root = p[0] || '', path = location.hash.split('?')[0];
    var staffOnly = ['tasks', 'incidents', 'dashboard', 'new', 'edit'].indexOf(root) >= 0;
    if (staffOnly && !Auth.is()) { go('/login'); return; }
    if (root === 'dashboard' && !Auth.can(['BQT'])) { toast('Chỉ Ban Quản Trị xem được trang này.', 'err'); go('/'); return; }
    if ((root === 'new' || root === 'edit') && !canEdit()) { toast('Bạn không có quyền thêm hoặc sửa tài sản.', 'err'); go('/'); return; }
    if (path !== lastPath) { window.scrollTo(0, 0); lastPath = path; }
    var tab = { '': 'home', assets: 'assets', a: 'assets', edit: 'assets', 'new': 'assets', scan: 'scan', report: 'report', login: 'login', tasks: 'tasks', incidents: 'incidents', dashboard: 'dashboard' }[root] || 'home';
    S.curTab = tab; markTab(tab);
    if (root === '') return viewHome();
    if (root === 'assets') return viewAssets(r);
    if (root === 'a' && p[1]) return viewAsset(r, p[1]);
    if (root === 'edit' && p[1]) return viewEdit(r, p[1]);
    if (root === 'new') return viewEdit(r, '');
    if (root === 'scan') return viewScan();
    if (root === 'report') return viewReport(r);
    if (root === 'login') return viewLogin(r);
    if (root === 'tasks') return viewTasks();
    if (root === 'incidents') return viewIncidents();
    if (root === 'dashboard') return viewDashboard();
    view.innerHTML = '<div class="page" style="padding-top:20px">' + emptyBox('search', 'Không tìm thấy trang', 'Đường dẫn này không tồn tại.', '<a class="btn" href="#/">Về trang chủ</a>') + '</div>';
  }

  /* ---------- Khởi động ---------- */
  function boot() {
    var sp = new URLSearchParams(location.search), a = sp.get('a');
    if (a) history.replaceState(null, '', location.pathname + '#/a/' + encodeURIComponent(a));
    Q.onAuthLost = function () { renderShell(); markTab(S.curTab); toast('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.', 'err'); go('/login'); };
    function start() {
      api('config').then(function (cfg) {
        S.cfg = cfg; renderShell(); window.addEventListener('hashchange', render); render();
      }).catch(function (e) {
        renderShell();
        view.innerHTML = '<div class="page" style="padding-top:20px">' + emptyBox('alert', e.code === 'CFG' ? 'Chưa cấu hình ứng dụng' : 'Không kết nối được hệ thống', e.message, e.code === 'CFG' ? '' : '<button class="btn" id="retry">' + icon('refresh', 'sm') + 'Thử lại</button>') + '</div>';
        var rt = $('#retry'); if (rt) rt.onclick = start;
      });
    }
    start();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
